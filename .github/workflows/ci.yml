name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # JOB 1: LINT
  lint:
    name: ShellCheck and Hadolint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  # JOB 2: BUILD
  build:
    name: Build Docker Image
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t devops-intern-final:${GITHUB_SHA} \
            ./app

      - name: Verify Docker image size
        run: |
          SIZE=$(docker image inspect devops-intern-final:${GITHUB_SHA} --format='{{.Size}}')
          echo "Image size: $((SIZE / 1048576)) MB"

          if [ "$SIZE" -ge 62914560 ]; then
            echo "ERROR: Docker image exceeds 60 MB"
            exit 1
          fi

          echo "Docker image size requirement passed."

      - name: Save Docker image
        run: docker save devops-intern-final:${GITHUB_SHA} -o app-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: devops-docker-image
          path: app-image.tar
          retention-days: 1

  # JOB 3: TEST
  test:
    name: Test Docker Application
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: devops-docker-image

      - name: Load Docker image
        run: docker load -i app-image.tar

      - name: Start NGINX container
        run: |
          docker run -d \
            --name devops-nginx \
            -p 18080:8080 \
            devops-intern-final:${GITHUB_SHA}

      - name: Test application health
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:18080/healthz; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed health check"
          docker logs devops-nginx
          exit 1

      - name: Test healthcheck script
        run: bash scripts/healthcheck.sh http://localhost:18080/healthz

      - name: Test homepage
        run: curl --fail http://localhost:18080/

  # JOB 4: PUBLISH
  publish:
    name: Publish Image to GHCR
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/marvdev-arch/devops-intern-final:${{ github.sha }}
            ghcr.io/marvdev-arch/devops-intern-final:latest